name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build the React frontend once and share it with every platform build via
  # artifact, since main.go embeds frontend/dist at compile time.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # sqlite requires CGO, so every target must build on a native runner with a
  # matching C toolchain. Cross-compiling from a single linux host would quietly
  # break sqlite at runtime.
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: build-frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            archive: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binary
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT="sub2balance-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "$OUTPUT" .

      - name: Package
        run: |
          BINARY="sub2balance-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar czf "${BINARY}.tar.gz" "$BINARY" config.yaml.example .env.example README.md

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sub2balance-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum sub2balance-*.tar.gz > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sub2balance-*.tar.gz
            checksums.txt
          generate_release_notes: true
          body: |
            ## Docker (recommended)

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            See `docker-compose.yml` in the repo for a full example.

            ## Standalone binary

            Each archive contains the binary plus `config.yaml.example`, `.env.example`, and `README.md`.

            ```bash
            # Linux AMD64 example
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sub2balance-linux-amd64.tar.gz
            tar xzf sub2balance-linux-amd64.tar.gz
            cp config.yaml.example config.yaml
            cp .env.example .env
            # edit .env to set JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
            ./sub2balance-linux-amd64
            ```

            ## Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
