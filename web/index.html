<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Request - Sub2Balance</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="/assets/app.js"></script>
</head>
<body class="bg-gray-100">
  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <span class="text-xl font-bold text-gray-900">Sub2Balance</span>
        </div>
        <div class="flex items-center space-x-4">
          <a href="/index.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Create Request</a>
          <a href="/my-requests.html" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">My Requests</a>
          <button onclick="auth.logout()" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8" x-data="createRequest()">
    <div class="card">
      <h2 class="text-xl font-bold mb-4">Query Subscription</h2>
      <form @submit.prevent="querySubscription" class="space-y-4">
        <div>
          <label class="form-label">Sub2API User ID</label>
          <input
            type="number"
            class="form-input"
            x-model="userId"
            required
            :disabled="loading"
          >
        </div>
        <div>
          <label class="form-label">Subscription ID</label>
          <input
            type="number"
            class="form-input"
            x-model="subscriptionId"
            required
            :disabled="loading"
          >
        </div>
        <div x-show="error" class="alert alert-error" x-text="error"></div>
        <button type="submit" class="btn btn-primary" :disabled="loading">
          <span x-show="!loading">Query</span>
          <span x-show="loading" class="flex items-center">
            <span class="spinner mr-2"></span>
            Querying...
          </span>
        </button>
      </form>
    </div>

    <div x-show="result" class="card mt-6">
      <h2 class="text-xl font-bold mb-4">Subscription Details</h2>
      <div class="space-y-2">
        <div><strong>User Email:</strong> <span x-text="result?.user_email"></span></div>
        <div><strong>Group Name:</strong> <span x-text="result?.group_name"></span></div>
        <div><strong>Original Amount:</strong> <span x-text="formatAmount(result?.original_amount)"></span></div>
        <div><strong>Consumed Amount:</strong> <span x-text="formatAmount(result?.consumed_amount)"></span></div>
        <div><strong>Conversion Amount:</strong> <span class="text-green-600 font-bold" x-text="formatAmount(result?.conversion_amount)"></span></div>
      </div>
      <div class="mt-4">
        <button @click="submitRequest" class="btn btn-primary" :disabled="submitting">
          <span x-show="!submitting">Submit Request</span>
          <span x-show="submitting" class="flex items-center">
            <span class="spinner mr-2"></span>
            Submitting...
          </span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Check authentication
    auth.requireAuth();

    function createRequest() {
      return {
        userId: '',
        subscriptionId: '',
        result: null,
        loading: false,
        submitting: false,
        error: '',

        async querySubscription() {
          this.loading = true;
          this.result = null;
          this.error = '';

          try {
            this.result = await api.post('/conversions/query', {
              user_id: parseInt(this.userId),
              subscription_id: parseInt(this.subscriptionId),
            });
          } catch (e) {
            this.error = e.message || 'Failed to query subscription';
          } finally {
            this.loading = false;
          }
        },

        async submitRequest() {
          this.submitting = true;

          try {
            await api.post('/conversions', this.result);
            utils.showSuccess('Request submitted successfully');
            window.location.href = '/my-requests.html';
          } catch (e) {
            utils.showError(e.message || 'Failed to submit request');
          } finally {
            this.submitting = false;
          }
        },

        formatAmount(amount) {
          return amount ? `$${amount.toFixed(2)}` : '$0.00';
        }
      };
    }
  </script>
</body>
</html>
