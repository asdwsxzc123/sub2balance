<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sub2Balance</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="/assets/app.js"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
          Sub2Balance
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Sign in to your account
        </p>
      </div>

      <div class="card" x-data="loginForm()">
        <form @submit.prevent="handleLogin" class="space-y-6">
          <div>
            <label for="email" class="form-label">Email address</label>
            <input
              id="email"
              type="email"
              x-model="email"
              required
              class="form-input"
              placeholder="admin@sub2balance.local"
              :disabled="loading"
            >
          </div>

          <div>
            <label for="password" class="form-label">Password</label>
            <input
              id="password"
              type="password"
              x-model="password"
              required
              class="form-input"
              placeholder="Enter your password"
              :disabled="loading"
            >
          </div>

          <div x-show="error" class="alert alert-error" x-text="error"></div>

          <div>
            <button
              type="submit"
              class="btn btn-primary w-full flex items-center justify-center"
              :disabled="loading"
            >
              <span x-show="!loading">Sign in</span>
              <span x-show="loading" class="flex items-center">
                <span class="spinner mr-2"></span>
                Signing in...
              </span>
            </button>
          </div>
        </form>

        <div class="mt-4 text-center text-sm text-gray-600">
          <p>Default admin: admin@sub2balance.local / admin123</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loginForm() {
      return {
        email: '',
        password: '',
        loading: false,
        error: '',

        async handleLogin() {
          this.error = '';
          this.loading = true;

          try {
            const response = await auth.login(this.email, this.password);

            // Redirect based on role
            if (response.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/staff.html';
            }
          } catch (error) {
            this.error = error.message || 'Login failed. Please check your credentials.';
          } finally {
            this.loading = false;
          }
        }
      };
    }

    // Redirect if already logged in
    if (auth.isAuthenticated()) {
      const user = auth.getUser();
      if (user.role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/staff.html';
      }
    }
  </script>
</body>
</html>
