<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests - Sub2Balance</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="/assets/app.js"></script>
</head>
<body class="bg-gray-100">
  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <span class="text-xl font-bold text-gray-900">Sub2Balance</span>
        </div>
        <div class="flex items-center space-x-4">
          <a href="/index.html" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Create Request</a>
          <a href="/my-requests.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">My Requests</a>
          <button onclick="auth.logout()" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8" x-data="myRequests()" x-init="loadRequests()">
    <div class="card">
      <h2 class="text-xl font-bold mb-4">My Requests</h2>

      <div x-show="loading" class="text-center py-8">
        <span class="spinner"></span>
        <span class="ml-2">Loading...</span>
      </div>

      <div x-show="!loading && requests.length === 0" class="text-center py-8 text-gray-500">
        No requests found
      </div>

      <div x-show="!loading && requests.length > 0" class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Group</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <template x-for="req in requests" :key="req.id">
              <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="req.id"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="req.user_email"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="req.group_name"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="formatAmount(req.final_amount || req.conversion_amount)"></td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span
                    class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                    :class="utils.getStatusClass(req.status)"
                    x-text="utils.formatStatus(req.status)"
                  ></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="utils.formatDate(req.created_at)"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                  <button @click="viewDetails(req.id)" class="btn btn-primary btn-sm">View</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Details Modal -->
    <div
      x-show="selectedRequest"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
      @click.self="selectedRequest = null"
      style="display: none;"
    >
      <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
        <div class="mt-3">
          <h3 class="text-lg font-bold mb-4">Request Details</h3>
          <template x-if="selectedRequest">
            <div class="space-y-3">
              <div class="flex justify-between">
                <strong>ID:</strong>
                <span x-text="selectedRequest.id"></span>
              </div>
              <div class="flex justify-between">
                <strong>User Email:</strong>
                <span x-text="selectedRequest.user_email"></span>
              </div>
              <div class="flex justify-between">
                <strong>Group:</strong>
                <span x-text="selectedRequest.group_name"></span>
              </div>
              <div class="flex justify-between">
                <strong>Original Amount:</strong>
                <span x-text="formatAmount(selectedRequest.original_amount)"></span>
              </div>
              <div class="flex justify-between">
                <strong>Consumed Amount:</strong>
                <span x-text="formatAmount(selectedRequest.consumed_amount)"></span>
              </div>
              <div class="flex justify-between">
                <strong>Conversion Amount:</strong>
                <span x-text="formatAmount(selectedRequest.conversion_amount)"></span>
              </div>
              <div x-show="selectedRequest.final_amount" class="flex justify-between">
                <strong>Final Amount:</strong>
                <span x-text="formatAmount(selectedRequest.final_amount)"></span>
              </div>
              <div class="flex justify-between">
                <strong>Status:</strong>
                <span
                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                  :class="utils.getStatusClass(selectedRequest.status)"
                  x-text="utils.formatStatus(selectedRequest.status)"
                ></span>
              </div>
              <div x-show="selectedRequest.review_note" class="flex justify-between">
                <strong>Review Note:</strong>
                <span x-text="selectedRequest.review_note"></span>
              </div>
              <div class="flex justify-between">
                <strong>Created:</strong>
                <span x-text="utils.formatDate(selectedRequest.created_at)"></span>
              </div>
              <div x-show="selectedRequest.reviewed_at" class="flex justify-between">
                <strong>Reviewed:</strong>
                <span x-text="utils.formatDate(selectedRequest.reviewed_at)"></span>
              </div>
            </div>
          </template>
          <div class="mt-6 flex justify-end">
            <button @click="selectedRequest = null" class="btn btn-primary">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Check authentication
    auth.requireAuth();

    function myRequests() {
      return {
        requests: [],
        selectedRequest: null,
        loading: false,

        async loadRequests() {
          this.loading = true;
          try {
            const response = await api.get('/conversions');
            this.requests = response.requests || [];
          } catch (e) {
            utils.showError(e.message || 'Failed to load requests');
          } finally {
            this.loading = false;
          }
        },

        async viewDetails(id) {
          try {
            const response = await api.get(`/conversions/${id}`);
            this.selectedRequest = response.request || response;
          } catch (e) {
            utils.showError(e.message || 'Failed to load request details');
          }
        },

        formatAmount(amount) {
          return amount ? `$${amount.toFixed(2)}` : '$0.00';
        }
      };
    }
  </script>
</body>
</html>
